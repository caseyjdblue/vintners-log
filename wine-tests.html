<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vintner's Log — Tests</title>
  <script src="wine-core.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; margin: 0; font-size: 14px; }
    header { background: #4A0F0F; color: #F9F3E8; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.1rem; margin: 0; }
    #run-btn { background: #C8963E; color: #2C1810; border: none; border-radius: 6px; padding: 8px 18px; font-weight: bold; cursor: pointer; font-size: .9rem; }
    #summary { background: #fff; padding: 12px 20px; border-bottom: 1px solid #ddd; display: flex; gap: 20px; align-items: center; font-size: .88rem; }
    #summary b { font-size: 1.1rem; }
    .pass { color: #2E7D32; } .fail { color: #C62828; } .muted { color: #888; }
    #bar { height: 6px; background: #eee; margin: 0; }
    #bar-fill { height: 100%; background: #2E7D32; width: 0; transition: width .3s; }
    .suite { background: #fff; margin: 12px 20px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: hidden; }
    .suite-hd { padding: 11px 16px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .suite-hd b { flex: 1; }
    .badge { border-radius: 20px; padding: 2px 9px; font-size: .72rem; font-weight: bold; }
    .bp { background: #E8F5E9; color: #2E7D32; } .bf { background: #FFEBEE; color: #C62828; } .bi { background: #eee; color: #888; }
    .t { padding: 8px 16px 8px 22px; border-bottom: 1px solid #f5f5f5; display: flex; gap: 8px; }
    .t:last-child { border: none; }
    .t.p { border-left: 3px solid #2E7D32; } .t.f { border-left: 3px solid #C62828; background: #fff8f8; } .t.s { border-left: 3px solid #ccc; opacity:.6; }
    .err { margin-top: 5px; background: #fff0f0; border: 1px solid #ffcdd2; border-radius: 4px; padding: 6px 8px; font-family: monospace; font-size: .78rem; color: #c62828; white-space: pre-wrap; }
    footer { text-align: center; padding: 12px; color: #aaa; font-size: .75rem; }
  </style>
</head>
<body>
<header>
  <h1>🍷 Vintner's Log — Test Runner</h1>
  <button id="run-btn" onclick="runAll()">▶ Run All Tests</button>
</header>
<div id="summary">
  <span>Ready — click Run All Tests</span>
</div>
<div id="bar"><div id="bar-fill"></div></div>
<div id="results"></div>
<footer>Tests run against live wine-core.js — localStorage is saved &amp; restored around each run.</footer>

<script>
// ── Mini framework ──────────────────────────────────────────────────
const suites = [];
let cur = null;

function describe(name, fn) { cur = { name, tests:[] }; suites.push(cur); fn(); cur = null; }
function it(label, fn)  { cur.tests.push({ label, fn, status:'pending', err:null }); }
function xit(label)     { cur.tests.push({ label, fn:null, status:'skip', err:null }); }

class Fail extends Error {}
function expect(v) { return {
  toBe:          (e) => { if (v !== e)              throw new Fail(`Expected ${j(e)}\n  Got ${j(v)}`); },
  toEqual:       (e) => { if (JSON.stringify(v) !== JSON.stringify(e)) throw new Fail(`Expected ${j(e)}\n  Got ${j(v)}`); },
  toBeTruthy:    ()  => { if (!v)                   throw new Fail(`Expected truthy, got ${j(v)}`); },
  toBeFalsy:     ()  => { if (v)                    throw new Fail(`Expected falsy, got ${j(v)}`); },
  toBeNull:      ()  => { if (v !== null)            throw new Fail(`Expected null, got ${j(v)}`); },
  toContain:     (e) => { if (!String(v).includes(e)) throw new Fail(`Expected to contain ${j(e)}`); },
  toNotContain:  (e) => { if (String(v).includes(e))  throw new Fail(`Expected NOT to contain ${j(e)}`); },
  toBeArray:     ()  => { if (!Array.isArray(v))    throw new Fail(`Expected Array, got ${typeof v}`); },
  toHaveLength:  (n) => { if (!v||v.length!==n)    throw new Fail(`Expected length ${n}, got ${v?.length}`); },
  toBeGreaterThan:(n)=> { if (!(v > n))             throw new Fail(`Expected > ${n}, got ${j(v)}`); },
  toBeLessThan:  (n) => { if (!(v < n))             throw new Fail(`Expected < ${n}, got ${j(v)}`); },
}; }
function j(v) { return JSON.stringify(v); }

// ── localStorage guard ─────────────────────────────────────────────
function clearTestData() { localStorage.removeItem(STORAGE_KEY); }

// ── Test suites ────────────────────────────────────────────────────
describe('formatDate()', () => {
  it('returns — for null',       () => expect(formatDate(null)).toBe('—'));
  it('returns — for empty',      () => expect(formatDate('')).toBe('—'));
  it('formats YYYY-MM-DD',       () => { const r = formatDate('2026-06-20'); expect(r).toContain('2026'); expect(r).toContain('Jun'); });
  it('formats blossom Apr 11',   () => { const r = formatDate('2026-04-11'); expect(r).toContain('Apr'); expect(r).toContain('11'); });
});

describe('daysUntil()', () => {
  it('returns null for null',    () => expect(daysUntil(null)).toBeNull());
  it('future date > 0',          () => { const d = new Date(); d.setDate(d.getDate()+30); expect(daysUntil(d.toISOString().slice(0,10))).toBeGreaterThan(0); });
  it('past date < 0',            () => { const d = new Date(); d.setDate(d.getDate()-10); expect(daysUntil(d.toISOString().slice(0,10))).toBeLessThan(0); });
  it('today = 0',                () => expect(daysUntil(new Date().toISOString().slice(0,10))).toBe(0));
  it('harvest after blossom',    () => expect(daysUntil('2026-06-20') > daysUntil('2026-04-11')).toBeTruthy());
});

describe('stageIndex()', () => {
  it('fruit_selection = 0',      () => expect(stageIndex('fruit_selection')).toBe(0));
  it('aging = 8',                () => expect(stageIndex('aging')).toBe(8));
  it('unknown = -1',             () => expect(stageIndex('nope')).toBe(-1));
  it('9 stages total',           () => expect(STAGE_IDS.length).toBe(9));
  it('no duplicate IDs',         () => expect(new Set(STAGE_IDS).size).toBe(9));
});

describe('getStageInfo()', () => {
  it('fruit_selection group = planning',      () => expect(getStageInfo('fruit_selection').group).toBe('planning'));
  it('primary_fermentation group = ferm.',    () => expect(getStageInfo('primary_fermentation').group).toBe('fermentation'));
  it('bottling group = aging',               () => expect(getStageInfo('bottling').group).toBe('aging'));
  it('unknown falls back to first stage',    () => expect(getStageInfo('???').id).toBe('fruit_selection'));
  it('all stages have id, label, icon, group', () => STAGES.forEach(s => { expect(s.id).toBeTruthy(); expect(s.label).toBeTruthy(); }));
});

describe('escHtml()', () => {
  it('escapes <script>',         () => expect(escHtml('<script>')).toBe('&lt;script&gt;'));
  it('escapes &',                () => expect(escHtml('A & B')).toBe('A &amp; B'));
  it('escapes "',                () => expect(escHtml('"hi"')).toBe('&quot;hi&quot;'));
  it('null → empty string',      () => expect(escHtml(null)).toBe(''));
  it('plain text unchanged',     () => expect(escHtml('Cherry 2026')).toBe('Cherry 2026'));
  it('XSS payload has no <img', () => expect(escHtml('<img onerror="x">')).toNotContain('<img'));
});

describe('generateId()', () => {
  it('returns a string',         () => expect(typeof generateId()).toBe('string'));
  it('not empty',                () => expect(generateId().length > 4).toBeTruthy());
  it('two calls differ',         () => expect(generateId() !== generateId()).toBeTruthy());
});

describe('loadData() / saveData()', () => {
  it('empty store → {batches:[]}', () => { clearTestData(); expect(loadData().batches).toHaveLength(0); });
  it('round-trips data',          () => { clearTestData(); saveData({batches:[{id:'x'}]}); expect(loadData().batches[0].id).toBe('x'); });
  it('overwrites on save',        () => { clearTestData(); saveData({batches:[{id:'a'}]}); saveData({batches:[{id:'b'}]}); expect(loadData().batches[0].id).toBe('b'); });
  it('corrupt JSON → {batches:[]}', () => { localStorage.setItem(STORAGE_KEY,'{{bad'); expect(loadData().batches).toBeArray(); });
});

describe('seedCherryBatch()', () => {
  it('creates 1 batch',          () => { clearTestData(); seedCherryBatch(); expect(loadData().batches).toHaveLength(1); });
  it('id = cherry-2026-seed',    () => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].id).toBe('cherry-2026-seed'); });
  it('name correct',             () => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].name).toBe('Backyard Sweet Cherry 2026'); });
  it('blossom = 2026-04-11',     () => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].blossom_date).toBe('2026-04-11'); });
  it('harvest = 2026-06-20',     () => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].harvest_date).toBe('2026-06-20'); });
  it('starts at fruit_selection',() => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].current_stage).toBe('fruit_selection'); });
  it('3 gallon batch',           () => { clearTestData(); seedCherryBatch(); expect(loadData().batches[0].gallons).toBe(3); });
  it('idempotent (no dup)',       () => { clearTestData(); seedCherryBatch(); seedCherryBatch(); expect(loadData().batches).toHaveLength(1); });
  it('inserts at front',         () => { clearTestData(); saveData({batches:[{id:'old',current_stage:'aging',completed_stages:[]}]}); seedCherryBatch(); expect(loadData().batches[0].id).toBe('cherry-2026-seed'); });
});

describe('batchProgress()', () => {
  const b = s => ({ current_stage:s, completed_stages:[] });
  it('fruit_selection → current 0', () => expect(batchProgress(b('fruit_selection')).current).toBe(0));
  it('aging → current 8',           () => expect(batchProgress(b('aging')).current).toBe(8));
  it('total always 9',              () => STAGE_IDS.forEach(id => expect(batchProgress(b(id)).total).toBe(9)));
});

describe('batchGroupClass()', () => {
  const b = (s, c=[]) => ({ current_stage:s, completed_stages:c });
  it('fruit_selection → stage-planning',         () => expect(batchGroupClass(b('fruit_selection'))).toBe('stage-planning'));
  it('preparation → stage-preparation',          () => expect(batchGroupClass(b('preparation'))).toBe('stage-preparation'));
  it('primary_fermentation → stage-fermentation',() => expect(batchGroupClass(b('primary_fermentation'))).toBe('stage-fermentation'));
  it('bottling → stage-aging',                   () => expect(batchGroupClass(b('bottling'))).toBe('stage-aging'));
  it('all 9 complete → stage-complete',          () => expect(batchGroupClass(b('aging',[...STAGE_IDS]))).toBe('stage-complete'));
});

describe('cherryRecipeDefaults()', () => {
  it('returns 7 ingredients',          () => expect(cherryRecipeDefaults(1)).toHaveLength(7));
  it('first = Sweet Cherries',         () => expect(cherryRecipeDefaults(1)[0].name).toBe('Sweet Cherries'));
  it('1 gal → 6.5 lbs cherries',      () => expect(cherryRecipeDefaults(1)[0].amount).toBe('6.5'));
  it('3 gal → 19.5 lbs cherries',     () => expect(cherryRecipeDefaults(3)[0].amount).toBe('19.5'));
  it('scales linearly',                () => expect(parseFloat(cherryRecipeDefaults(2)[0].amount)).toBe(parseFloat(cherryRecipeDefaults(1)[0].amount)*2));
  it('all items have name/amount/unit',() => cherryRecipeDefaults(1).forEach(i => { expect(i.name).toBeTruthy(); expect(i.unit).toBeTruthy(); }));
});

describe('estimateAbv()', () => {
  it('OG 1.090 FG 1.000 → 11.8%', () => expect(estimateAbv(1.090, 1.000)).toBe(11.8));
  it('OG 1.090 FG 1.010 → 10.5%', () => expect(estimateAbv(1.090, 1.010)).toBe(10.5));
  it('same OG/FG → 0%',            () => expect(estimateAbv(1.090, 1.090)).toBe(0));
  it('lower FG = higher ABV',       () => expect(estimateAbv(1.090,1.000) > estimateAbv(1.090,1.020)).toBeTruthy());
  it('returns a number',            () => expect(typeof estimateAbv(1.090,1.010)).toBe('number'));
});

describe('Stage ordering', () => {
  it('planning before preparation',   () => expect(stageIndex('recipe')).toBeLessThan(stageIndex('preparation')));
  it('preparation before primary',    () => expect(stageIndex('preparation')).toBeLessThan(stageIndex('primary_fermentation')));
  it('primary before secondary',      () => expect(stageIndex('primary_fermentation')).toBeLessThan(stageIndex('secondary_fermentation')));
  it('secondary before clarification',() => expect(stageIndex('secondary_fermentation')).toBeLessThan(stageIndex('clarification')));
  it('clarification before bottling', () => expect(stageIndex('clarification')).toBeLessThan(stageIndex('bottling')));
  it('bottling before aging',         () => expect(stageIndex('bottling')).toBeLessThan(stageIndex('aging')));
  it('blossom-to-harvest gap ~70 days',() => { const gap = daysUntil('2026-06-20') - daysUntil('2026-04-11'); expect(gap >= 65 && gap <= 75).toBeTruthy(); });
});

// ── Runner ─────────────────────────────────────────────────────────
async function runAll() {
  const snap = localStorage.getItem(STORAGE_KEY);
  const restore = () => snap !== null ? localStorage.setItem(STORAGE_KEY, snap) : localStorage.removeItem(STORAGE_KEY);

  document.getElementById('run-btn').disabled = true;
  const t0 = performance.now();
  let pass = 0, fail = 0, skip = 0;

  for (const suite of suites) {
    for (const t of suite.tests) {
      if (!t.fn) { t.status = 'skip'; skip++; continue; }
      try { await t.fn(); t.status = 'pass'; pass++; }
      catch(e) { t.status = 'fail'; t.err = e.message; fail++; }
    }
  }

  restore();
  const elapsed = ((performance.now()-t0)/1000).toFixed(2);
  const total = pass+fail+skip;

  document.getElementById('summary').innerHTML =
    `<b class="pass">${pass} passed</b> &nbsp; <b class="fail">${fail} failed</b> &nbsp; <span class="muted">${skip} skipped</span>
     &nbsp;&nbsp; <div style="flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden"><div style="height:100%;width:${total?(pass/total*100):0}%;background:#2E7D32"></div></div>
     &nbsp;&nbsp; <span class="muted">${elapsed}s</span>`;

  document.getElementById('run-btn').disabled = false;
  render();
}

function render() {
  document.getElementById('results').innerHTML = suites.map(suite => {
    const p = suite.tests.filter(t=>t.status==='pass').length;
    const f = suite.tests.filter(t=>t.status==='fail').length;
    const badge = f ? `<span class="badge bf">${f} failed</span>` : p===suite.tests.length ? `<span class="badge bp">${p} passed</span>` : `<span class="badge bi">${suite.tests.length} tests</span>`;
    const rows = suite.tests.map(t => {
      const icon = {pass:'✓',fail:'✗',skip:'—',pending:'○'}[t.status];
      const err = t.err ? `<div class="err">${escHtml(t.err)}</div>` : '';
      return `<div class="t ${t.status[0]}"><span style="width:14px;flex-shrink:0">${icon}</span><div style="flex:1">${escHtml(t.label)}${err}</div></div>`;
    }).join('');
    return `<div class="suite"><div class="suite-hd"><b>${escHtml(suite.name)}</b>${badge}</div>${rows}</div>`;
  }).join('');
}

render(); // initial pending state
</script>
</body>
</html>
