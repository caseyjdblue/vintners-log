<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintner's Log — Test Runner</title>
  <style>
    :root {
      --pass:    #2E7D32;
      --pass-bg: #E8F5E9;
      --fail:    #C62828;
      --fail-bg: #FFEBEE;
      --skip:    #6D4C41;
      --skip-bg: #EFEBE9;
      --ink:     #1A1A2E;
      --muted:   #666;
      --border:  #DDD;
      --bg:      #F5F5F5;
      --white:   #FFFFFF;
      --burg:    #6B1A1A;
      --gold:    #C8963E;
      --radius:  8px;
      --shadow:  0 1px 4px rgba(0,0,0,.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
    code, pre { font-family: 'Cascadia Code', 'Fira Code', monospace; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #4A0F0F, #6B1A1A);
      color: #F9F3E8;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
    }
    header h1 { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
    header .sub { font-size: .75rem; color: #E0B86A; margin-top: 2px; }
    .run-btn {
      background: var(--gold); color: #2C1810; border: none; border-radius: var(--radius);
      padding: 9px 20px; font-size: .9rem; font-weight: bold; cursor: pointer;
      font-family: inherit; transition: background .15s;
    }
    .run-btn:hover { background: #E0B86A; }
    .run-btn:active { transform: scale(.97); }

    /* ── Summary bar ── */
    #summary {
      display: flex; gap: 12px; padding: 14px 24px;
      background: var(--white); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
    }
    .stat { display: flex; align-items: center; gap: 6px; font-size: .88rem; }
    .stat .dot { width: 12px; height: 12px; border-radius: 50%; }
    .stat .val { font-weight: bold; font-size: 1.1rem; }
    .dot-pass { background: var(--pass); }
    .dot-fail { background: var(--fail); }
    .dot-skip { background: #bbb; }
    .progress-bar {
      flex: 1; min-width: 160px; height: 8px; background: #eee;
      border-radius: 4px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--pass); transition: width .4s; border-radius: 4px; }
    #duration { font-size: .78rem; color: var(--muted); margin-left: auto; }
    #status-text { font-size: .85rem; font-weight: bold; }
    #status-text.all-pass { color: var(--pass); }
    #status-text.has-fail  { color: var(--fail); }
    #status-text.running   { color: var(--gold); }
    #status-text.idle      { color: var(--muted); }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 24px;
      background: var(--white); border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .toolbar label { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .filter-btn {
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--white); font-size: .78rem; cursor: pointer; font-family: inherit;
      transition: all .1s;
    }
    .filter-btn.active { background: var(--burg); color: #fff; border-color: var(--burg); }
    .toolbar input[type=search] {
      padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: .82rem; font-family: inherit; width: 200px;
    }
    .expand-all { margin-left: auto; font-size: .78rem; color: var(--burg); cursor: pointer; background: none; border: none; font-family: inherit; }
    .expand-all:hover { text-decoration: underline; }

    /* ── Suite ── */
    .suite {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); margin: 12px 24px; overflow: hidden;
      box-shadow: var(--shadow);
    }
    .suite-header {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      cursor: pointer; user-select: none; background: #FAFAFA;
      border-bottom: 1px solid var(--border);
    }
    .suite-header:hover { background: #F0F0F0; }
    .suite-icon { font-size: 1rem; }
    .suite-name { font-weight: bold; font-size: .95rem; flex: 1; }
    .suite-badge {
      font-size: .72rem; font-weight: bold; padding: 2px 8px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge-pass { background: var(--pass-bg); color: var(--pass); }
    .badge-fail { background: var(--fail-bg); color: var(--fail); }
    .badge-idle { background: #EEE; color: var(--muted); }
    .chevron { font-size: .7rem; color: var(--muted); transition: transform .2s; }
    .suite.collapsed .suite-body { display: none; }
    .suite.collapsed .chevron { transform: rotate(-90deg); }

    /* ── Test rows ── */
    .suite-body { padding: 0; }
    .test-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 9px 16px 9px 20px;
      border-bottom: 1px solid #F0F0F0; font-size: .86rem;
    }
    .test-row:last-child { border-bottom: none; }
    .test-row.pass { border-left: 3px solid var(--pass); }
    .test-row.fail { border-left: 3px solid var(--fail); background: var(--fail-bg); }
    .test-row.skip { border-left: 3px solid #ccc; opacity: .6; }
    .test-row.pending { border-left: 3px solid #ccc; }
    .test-icon { font-size: .85rem; width: 16px; flex-shrink: 0; margin-top: 1px; }
    .test-name { flex: 1; line-height: 1.4; }
    .test-dur  { font-size: .72rem; color: var(--muted); white-space: nowrap; }
    .test-error {
      margin-top: 6px; background: #FFF0F0; border: 1px solid #FFCDD2;
      border-radius: 4px; padding: 8px 10px; font-size: .8rem;
      color: var(--fail); white-space: pre-wrap; font-family: monospace;
      width: 100%;
    }
    .test-row-inner { flex: 1; min-width: 0; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 12px; font-size: .75rem; color: var(--muted);
      border-top: 1px solid var(--border); margin-top: 12px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🍷 Vintner's Log — Test Runner</h1>
    <div class="sub">Unit tests for wine batch lifecycle logic</div>
  </div>
  <button class="run-btn" id="run-btn" onclick="runAll()">▶ Run All Tests</button>
</header>

<div id="summary">
  <div class="stat"><div class="dot dot-pass"></div><span class="val" id="cnt-pass">—</span><span>passed</span></div>
  <div class="stat"><div class="dot dot-fail"></div><span class="val" id="cnt-fail">—</span><span>failed</span></div>
  <div class="stat"><div class="dot dot-skip"></div><span class="val" id="cnt-skip">—</span><span>skipped</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <span id="status-text" class="idle">Ready — click Run All Tests</span>
  <span id="duration"></span>
</div>

<div class="toolbar">
  <button class="filter-btn active" id="f-all"  onclick="setFilter('all')">All</button>
  <button class="filter-btn"        id="f-fail" onclick="setFilter('fail')">Failures only</button>
  <input type="search" id="search-box" placeholder="Filter by name…" oninput="applyFilter()" />
  <button class="expand-all" onclick="toggleAllSuites()">Collapse all</button>
</div>

<div id="results"></div>

<footer>
  Vintner's Log Test Runner &mdash; tests run in-browser, no server needed
</footer>

<script>
// ══════════════════════════════════════════════════════════════════════
//  SECTION 1 — MINI TEST FRAMEWORK
// ══════════════════════════════════════════════════════════════════════
const _suites = [];
let _current  = null;

function describe(name, icon, fn) {
  _current = { name, icon, tests: [] };
  _suites.push(_current);
  fn();
  _current = null;
}

function it(name, fn) {
  if (!_current) throw new Error('it() called outside describe()');
  _current.tests.push({ name, fn, status: 'pending', error: null, duration: null });
}

function xit(name) {
  if (!_current) throw new Error('xit() called outside describe()');
  _current.tests.push({ name, fn: null, status: 'skip', error: null, duration: null });
}

class AssertionError extends Error {
  constructor(msg) { super(msg); this.name = 'AssertionError'; }
}

function expect(actual) {
  return {
    toBe(expected) {
      if (actual !== expected)
        throw new AssertionError(`Expected ${fmt(expected)}\n  Received ${fmt(actual)}`);
    },
    toEqual(expected) {
      const a = JSON.stringify(actual), b = JSON.stringify(expected);
      if (a !== b)
        throw new AssertionError(`Expected ${b}\n  Received ${a}`);
    },
    toBeTruthy() {
      if (!actual)
        throw new AssertionError(`Expected truthy, received ${fmt(actual)}`);
    },
    toBeFalsy() {
      if (actual)
        throw new AssertionError(`Expected falsy, received ${fmt(actual)}`);
    },
    toBeNull() {
      if (actual !== null)
        throw new AssertionError(`Expected null, received ${fmt(actual)}`);
    },
    toBeGreaterThan(n) {
      if (!(actual > n))
        throw new AssertionError(`Expected > ${n}, received ${fmt(actual)}`);
    },
    toBeLessThan(n) {
      if (!(actual < n))
        throw new AssertionError(`Expected < ${n}, received ${fmt(actual)}`);
    },
    toContain(str) {
      if (!String(actual).includes(String(str)))
        throw new AssertionError(`Expected to contain ${fmt(str)}\n  Received ${fmt(actual)}`);
    },
    toNotContain(str) {
      if (String(actual).includes(String(str)))
        throw new AssertionError(`Expected NOT to contain ${fmt(str)}\n  Received ${fmt(actual)}`);
    },
    toBeArray() {
      if (!Array.isArray(actual))
        throw new AssertionError(`Expected an Array, received ${typeof actual}`);
    },
    toHaveLength(n) {
      if (!actual || actual.length !== n)
        throw new AssertionError(`Expected length ${n}, received ${actual?.length}`);
    },
    toMatch(regex) {
      if (!regex.test(String(actual)))
        throw new AssertionError(`Expected to match ${regex}, received ${fmt(actual)}`);
    },
    toThrow() {
      if (typeof actual !== 'function')
        throw new AssertionError('toThrow() requires a function');
      try { actual(); throw new AssertionError('Expected function to throw, but it did not'); }
      catch (e) { if (e instanceof AssertionError) throw e; }
    },
  };
}

function fmt(v) {
  if (v === null) return 'null';
  if (v === undefined) return 'undefined';
  if (typeof v === 'string') return `"${v}"`;
  return String(v);
}

// ══════════════════════════════════════════════════════════════════════
//  SECTION 2 — PRODUCTION CODE UNDER TEST
//  (Pure / logic functions copied from wine.html — no DOM dependencies)
// ══════════════════════════════════════════════════════════════════════

const STORAGE_KEY = 'vintners_log_v1';

const STAGES = [
  { id: 'fruit_selection',        label: 'Fruit Selection',   icon: '🍒', group: 'planning' },
  { id: 'methodology',            label: 'Methodology',       icon: '📋', group: 'planning' },
  { id: 'recipe',                 label: 'Recipe',            icon: '🧪', group: 'planning' },
  { id: 'preparation',            label: 'Preparation',       icon: '⚗️',  group: 'preparation' },
  { id: 'primary_fermentation',   label: 'Primary Ferm.',     icon: '🫧', group: 'fermentation' },
  { id: 'secondary_fermentation', label: 'Secondary Ferm.',   icon: '🔬', group: 'fermentation' },
  { id: 'clarification',          label: 'Clarification',     icon: '✨', group: 'fermentation' },
  { id: 'bottling',               label: 'Bottling',          icon: '🍾', group: 'aging' },
  { id: 'aging',                  label: 'Aging',             icon: '🪵', group: 'aging' },
];

const STAGE_IDS = STAGES.map(s => s.id);

const GROUP_CLASS = {
  planning:     'stage-planning',
  preparation:  'stage-preparation',
  fermentation: 'stage-fermentation',
  aging:        'stage-aging',
  complete:     'stage-complete',
};

// ── Mock localStorage ─────────────────────────────────────────────────
const _mockStore = {};
const _localStorage = {
  getItem:    (k)    => _mockStore[k] ?? null,
  setItem:    (k, v) => { _mockStore[k] = String(v); },
  removeItem: (k)    => { delete _mockStore[k]; },
  clear:      ()     => { Object.keys(_mockStore).forEach(k => delete _mockStore[k]); },
};

function loadData() {
  try {
    const raw = _localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { batches: [] };
  } catch { return { batches: [] }; }
}

function saveData(data) {
  _localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getData() { return loadData(); }

function clearStore() { _localStorage.clear(); }

function seedCherryBatch() {
  const data = loadData();
  const already = data.batches.find(b => b.id === 'cherry-2026-seed');
  if (already) return;
  const cherryBatch = {
    id: 'cherry-2026-seed',
    name: 'Backyard Sweet Cherry 2026',
    fruit: 'Sweet Cherry',
    year: 2026,
    gallons: 3,
    source: 'Home Garden',
    harvest_date: '2026-06-20',
    blossom_date: '2026-04-11',
    current_stage: 'fruit_selection',
    completed_stages: [],
    created: new Date().toISOString(),
    notes: 'Two sweet cherry trees in the backyard blossomed April 11, 2026.',
    stages: {}
  };
  data.batches.unshift(cherryBatch);
  saveData(data);
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function daysUntil(isoDate) {
  if (!isoDate) return null;
  const target = new Date(isoDate + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.ceil((target - now) / 86400000);
}

function stageIndex(stageId) {
  return STAGE_IDS.indexOf(stageId);
}

function getStageInfo(stageId) {
  return STAGES.find(s => s.id === stageId) || STAGES[0];
}

function batchProgress(batch) {
  const idx = stageIndex(batch.current_stage);
  return { current: idx, total: STAGES.length };
}

function batchGroupClass(batch) {
  if (batch.completed_stages?.length === STAGES.length) return 'stage-complete';
  const info = getStageInfo(batch.current_stage);
  return GROUP_CLASS[info.group] || 'stage-planning';
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Cherry recipe defaults (mirrors app logic)
function cherryRecipeDefaults(gallons) {
  return [
    { name: 'Sweet Cherries',          amount: (6.5 * gallons).toFixed(1), unit: 'lbs' },
    { name: 'Granulated Sugar',        amount: (2.0 * gallons).toFixed(1), unit: 'lbs' },
    { name: 'Water',                   amount: (0.6 * gallons).toFixed(2), unit: 'gallons' },
    { name: 'Pectic Enzyme',           amount: (0.5 * gallons).toFixed(1), unit: 'tsp' },
    { name: 'Acid Blend',              amount: (0.5 * gallons).toFixed(1), unit: 'tsp' },
    { name: 'Yeast Nutrient',          amount: (1.0 * gallons).toFixed(1), unit: 'tsp' },
    { name: 'Potassium Metabisulfite', amount: (0.25 * gallons).toFixed(2), unit: 'tsp' },
  ];
}

// ABV estimator (mirrors app logic)
function estimateAbv(og, fg) {
  return parseFloat(((og - fg) * 131.25).toFixed(1));
}

// ══════════════════════════════════════════════════════════════════════
//  SECTION 3 — TEST SUITES
// ══════════════════════════════════════════════════════════════════════

describe('Utility: formatDate()', '📅', () => {
  it('returns "—" for null', () => {
    expect(formatDate(null)).toBe('—');
  });
  it('returns "—" for undefined', () => {
    expect(formatDate(undefined)).toBe('—');
  });
  it('returns "—" for empty string', () => {
    expect(formatDate('')).toBe('—');
  });
  it('formats a YYYY-MM-DD date string', () => {
    const result = formatDate('2026-06-20');
    expect(result).toContain('2026');
    expect(result).toContain('Jun');
  });
  it('formats blossom date April 11 2026', () => {
    const result = formatDate('2026-04-11');
    expect(result).toContain('Apr');
    expect(result).toContain('11');
    expect(result).toContain('2026');
  });
  it('handles a full ISO datetime string', () => {
    const result = formatDate('2026-06-20T12:00:00.000Z');
    expect(result).toContain('2026');
  });
});

describe('Utility: daysUntil()', '⏳', () => {
  it('returns null for null input', () => {
    expect(daysUntil(null)).toBeNull();
  });
  it('returns null for undefined input', () => {
    expect(daysUntil(undefined)).toBeNull();
  });
  it('returns a positive number for a future date', () => {
    const future = new Date();
    future.setDate(future.getDate() + 30);
    const iso = future.toISOString().slice(0, 10);
    expect(daysUntil(iso)).toBeGreaterThan(0);
  });
  it('returns a negative number for a past date', () => {
    const past = new Date();
    past.setDate(past.getDate() - 10);
    const iso = past.toISOString().slice(0, 10);
    expect(daysUntil(iso)).toBeLessThan(0);
  });
  it('returns 0 for today', () => {
    const today = new Date().toISOString().slice(0, 10);
    expect(daysUntil(today)).toBe(0);
  });
  it('cherry harvest (2026-06-20) is in the future relative to blossom (2026-04-11)', () => {
    // harvest should be > blossom
    const harvestDays = daysUntil('2026-06-20');
    const blossomDays = daysUntil('2026-04-11');
    expect(harvestDays > blossomDays).toBeTruthy();
  });
});

describe('Utility: stageIndex()', '🔢', () => {
  it('fruit_selection is stage 0', () => {
    expect(stageIndex('fruit_selection')).toBe(0);
  });
  it('methodology is stage 1', () => {
    expect(stageIndex('methodology')).toBe(1);
  });
  it('recipe is stage 2', () => {
    expect(stageIndex('recipe')).toBe(2);
  });
  it('preparation is stage 3', () => {
    expect(stageIndex('preparation')).toBe(3);
  });
  it('primary_fermentation is stage 4', () => {
    expect(stageIndex('primary_fermentation')).toBe(4);
  });
  it('secondary_fermentation is stage 5', () => {
    expect(stageIndex('secondary_fermentation')).toBe(5);
  });
  it('clarification is stage 6', () => {
    expect(stageIndex('clarification')).toBe(6);
  });
  it('bottling is stage 7', () => {
    expect(stageIndex('bottling')).toBe(7);
  });
  it('aging is stage 8 (last stage)', () => {
    expect(stageIndex('aging')).toBe(8);
  });
  it('unknown stage returns -1', () => {
    expect(stageIndex('unknown_stage')).toBe(-1);
  });
  it('total stages is 9', () => {
    expect(STAGE_IDS.length).toBe(9);
  });
});

describe('Utility: getStageInfo()', '📋', () => {
  it('returns correct object for fruit_selection', () => {
    const info = getStageInfo('fruit_selection');
    expect(info.id).toBe('fruit_selection');
    expect(info.group).toBe('planning');
  });
  it('returns correct group for primary_fermentation', () => {
    expect(getStageInfo('primary_fermentation').group).toBe('fermentation');
  });
  it('returns correct group for bottling', () => {
    expect(getStageInfo('bottling').group).toBe('aging');
  });
  it('falls back to STAGES[0] for unknown id', () => {
    const info = getStageInfo('nonexistent');
    expect(info.id).toBe('fruit_selection');
  });
  it('every stage has id, label, icon, group fields', () => {
    STAGES.forEach(s => {
      expect(s.id).toBeTruthy();
      expect(s.label).toBeTruthy();
      expect(s.icon).toBeTruthy();
      expect(s.group).toBeTruthy();
    });
  });
});

describe('Utility: escHtml()', '🛡️', () => {
  it('escapes < and >', () => {
    expect(escHtml('<script>')).toBe('&lt;script&gt;');
  });
  it('escapes & ampersand', () => {
    expect(escHtml('Rock & Roll')).toBe('Rock &amp; Roll');
  });
  it('escapes double quotes', () => {
    expect(escHtml('"hello"')).toBe('&quot;hello&quot;');
  });
  it('returns empty string for null', () => {
    expect(escHtml(null)).toBe('');
  });
  it('returns empty string for undefined', () => {
    expect(escHtml(undefined)).toBe('');
  });
  it('does not alter plain text', () => {
    expect(escHtml('Backyard Sweet Cherry 2026')).toBe('Backyard Sweet Cherry 2026');
  });
  it('handles XSS payload', () => {
    const xss = '<img src=x onerror="alert(1)">';
    const escaped = escHtml(xss);
    expect(escaped).toNotContain('<img');
    expect(escaped).toContain('&lt;img');
  });
});

describe('Utility: generateId()', '🔑', () => {
  it('returns a non-empty string', () => {
    expect(generateId()).toBeTruthy();
  });
  it('two calls produce different IDs', () => {
    const a = generateId(), b = generateId();
    expect(a !== b).toBeTruthy();
  });
  it('returns a string type', () => {
    expect(typeof generateId()).toBe('string');
  });
  it('has reasonable length (> 5 chars)', () => {
    expect(generateId().length > 5).toBeTruthy();
  });
});

describe('Data Layer: loadData() / saveData()', '💾', () => {
  it('returns {batches:[]} when store is empty', () => {
    clearStore();
    const data = loadData();
    expect(data.batches).toBeArray();
    expect(data.batches).toHaveLength(0);
  });
  it('round-trips data correctly', () => {
    clearStore();
    const payload = { batches: [{ id: 'test-1', name: 'Test Batch' }] };
    saveData(payload);
    const loaded = loadData();
    expect(loaded.batches[0].id).toBe('test-1');
    expect(loaded.batches[0].name).toBe('Test Batch');
  });
  it('overwrites existing data on save', () => {
    clearStore();
    saveData({ batches: [{ id: 'old' }] });
    saveData({ batches: [{ id: 'new' }] });
    expect(loadData().batches[0].id).toBe('new');
  });
  it('handles corrupt JSON gracefully', () => {
    _localStorage.setItem(STORAGE_KEY, '{ broken json ::');
    const data = loadData();
    expect(data.batches).toBeArray();
  });
  it('stores multiple batches', () => {
    clearStore();
    saveData({ batches: [{ id: 'a' }, { id: 'b' }, { id: 'c' }] });
    expect(loadData().batches).toHaveLength(3);
  });
});

describe('Data Layer: seedCherryBatch()', '🍒', () => {

//  SECTION 4 — RUNNER + UI
// ══════════════════════════════════════════════════════════════════════
let _filterMode = 'all';
let _allExpanded = true;

async function runAll() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';
  setStatusText('running', 'Running…');

  const start = performance.now();
  let pass = 0, fail = 0, skip = 0;

  for (const suite of _suites) {
    for (const test of suite.tests) {
      if (test.status === 'skip' || !test.fn) {
        test.status = 'skip'; skip++; continue;
      }
      const t0 = performance.now();
      try {
        await test.fn();
        test.status = 'pass';
        test.duration = performance.now() - t0;
        pass++;
      } catch (e) {
        test.status = 'fail';
        test.error = e.message || String(e);
        test.duration = performance.now() - t0;
        fail++;
      }
    }
  }

  const elapsed = ((performance.now() - start) / 1000).toFixed(2);
  const total = pass + fail + skip;

  document.getElementById('cnt-pass').textContent = pass;
  document.getElementById('cnt-fail').textContent = fail;
  document.getElementById('cnt-skip').textContent = skip;
  document.getElementById('progress-fill').style.width = total ? `${(pass / total) * 100}%` : '0%';
  document.getElementById('duration').textContent = `${elapsed}s`;

  if (fail === 0) setStatusText('all-pass', `✓ All ${pass} tests passed`);
  else            setStatusText('has-fail',  `✗ ${fail} failed, ${pass} passed`);

  btn.disabled = false;
  btn.textContent = '▶ Run All Tests';
  renderResults();
}

function setStatusText(cls, text) {
  const el = document.getElementById('status-text');
  el.className = cls;
  el.textContent = text;
}

function setFilter(mode) {
  _filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + mode)?.classList.add('active');
  renderResults();
}

function applyFilter() { renderResults(); }

function toggleAllSuites() {
  _allExpanded = !_allExpanded;
  document.querySelectorAll('.suite').forEach(el => {
    el.classList.toggle('collapsed', !_allExpanded);
  });
  document.querySelector('.expand-all').textContent = _allExpanded ? 'Collapse all' : 'Expand all';
}

function renderResults() {
  const search = document.getElementById('search-box').value.toLowerCase();
  const container = document.getElementById('results');
  container.innerHTML = '';

  for (const suite of _suites) {
    const tests = suite.tests.filter(t => {
      if (_filterMode === 'fail' && t.status !== 'fail') return false;
      if (search && !t.name.toLowerCase().includes(search)) return false;
      return true;
    });
    if (tests.length === 0) continue;

    const passCount = tests.filter(t => t.status === 'pass').length;
    const failCount = tests.filter(t => t.status === 'fail').length;
    const pendCount = tests.filter(t => t.status === 'pending').length;

    let badgeClass = 'badge-idle';
    let badgeText  = `${tests.length} tests`;
    if (failCount > 0) { badgeClass = 'badge-fail'; badgeText = `${failCount} failed`; }
    else if (passCount === tests.length && pendCount === 0) { badgeClass = 'badge-pass'; badgeText = `${passCount} passed`; }

    const testRows = tests.map(t => {
      const icon = { pass: '✓', fail: '✗', skip: '—', pending: '○' }[t.status] || '○';
      const dur  = t.duration != null ? `${t.duration.toFixed(1)}ms` : '';
      const errorBlock = t.error
        ? `<div class="test-error">${escHtml(t.error)}</div>` : '';
      return `<div class="test-row ${t.status}">
        <span class="test-icon">${icon}</span>
        <div class="test-row-inner">
          <span class="test-name">${escHtml(t.name)}</span>
          ${errorBlock}
        </div>
        <span class="test-dur">${dur}</span>
      </div>`;
    }).join('');

    const suiteEl = document.createElement('div');
    suiteEl.className = 'suite';
    suiteEl.innerHTML = `
      <div class="suite-header" onclick="this.closest('.suite').classList.toggle('collapsed')">
        <span class="suite-icon">${suite.icon}</span>
        <span class="suite-name">${escHtml(suite.name)}</span>
        <span class="suite-badge ${badgeClass}">${badgeText}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="suite-body">${testRows}</div>`;
    container.appendChild(suiteEl);
  }

  if (container.children.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">No tests match the current filter.</div>`;
  }
}

// Initial render (pending state)
renderResults();
</script>
