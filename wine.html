<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintner's Log — Wine Batch Manager</title>
  <style>
    /* ── Design Tokens ─────────────────────────────────────────── */
    :root {
      --burgundy:   #6B1A1A;
      --burgundy-d: #4A0F0F;
      --burgundy-l: #8C2A2A;
      --gold:       #C8963E;
      --gold-l:     #E0B86A;
      --cream:      #F9F3E8;
      --cream-d:    #EDE4D0;
      --ink:        #2C1810;
      --ink-l:      #5A3A2A;
      --muted:      #8A7060;
      --green:      #3A7D44;
      --green-l:    #EAF4EC;
      --blue:       #2A5A8C;
      --blue-l:     #EAF0F8;
      --orange:     #C85A1A;
      --orange-l:   #FDF0E8;
      --white:      #FFFFFF;
      --shadow-sm:  0 1px 3px rgba(44,24,16,.12);
      --shadow-md:  0 4px 12px rgba(44,24,16,.15);
      --shadow-lg:  0 8px 24px rgba(44,24,16,.18);
      --radius:     10px;
      --radius-lg:  16px;
    }

    /* ── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Georgia', serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--burgundy); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; }

    /* ── Header ────────────────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg, var(--burgundy-d) 0%, var(--burgundy) 60%, var(--burgundy-l) 100%);
      color: var(--cream);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: .02em;
    }
    .app-header .logo .icon { font-size: 1.6rem; }
    .app-header .logo .sub {
      font-size: .7rem;
      font-weight: normal;
      color: var(--gold-l);
      letter-spacing: .08em;
      text-transform: uppercase;
      display: block;
      line-height: 1;
    }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: var(--radius);
      font-size: .9rem;
      font-family: inherit;
      font-weight: bold;
      transition: all .15s;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .btn-primary {
      background: var(--burgundy);
      color: var(--cream);
      border-color: var(--burgundy);
    }
    .btn-primary:hover { background: var(--burgundy-d); border-color: var(--burgundy-d); }
    .btn-gold {
      background: var(--gold);
      color: var(--ink);
      border-color: var(--gold);
    }
    .btn-gold:hover { background: var(--gold-l); border-color: var(--gold-l); }
    .btn-outline {
      background: transparent;
      color: var(--burgundy);
      border-color: var(--burgundy);
    }
    .btn-outline:hover { background: var(--burgundy); color: var(--cream); }
    .btn-ghost {
      background: transparent;
      color: var(--cream);
      border-color: rgba(249,243,232,.4);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .btn-danger {
      background: #c0392b;
      color: #fff;
      border-color: #c0392b;
    }
    .btn-danger:hover { background: #962d22; }
    .btn-sm { padding: 5px 12px; font-size: .8rem; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Layout ────────────────────────────────────────────────── */
    .app-body { flex: 1; padding: 28px 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── Views ─────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Dashboard ─────────────────────────────────────────────── */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .dashboard-header h1 {
      font-size: 1.8rem;
      color: var(--burgundy);
    }
    .dashboard-header h1 span {
      font-size: .95rem;
      color: var(--muted);
      font-weight: normal;
      display: block;
      margin-top: 2px;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--burgundy);
    }
    .stat-card .val {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--burgundy);
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: .78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-top: 4px;
    }
    .stat-card.green { border-left-color: var(--green); }
    .stat-card.green .val { color: var(--green); }
    .stat-card.gold { border-left-color: var(--gold); }
    .stat-card.gold .val { color: var(--gold); }
    .stat-card.orange { border-left-color: var(--orange); }
    .stat-card.orange .val { color: var(--orange); }

    /* Batch grid */
    .batch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .empty-state {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 1rem; }

    /* Batch card */
    .batch-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .batch-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--burgundy);
    }
    .card-header {
      background: linear-gradient(135deg, var(--burgundy-d), var(--burgundy));
      padding: 18px 20px 14px;
      color: var(--cream);
    }
    .card-header .batch-name {
      font-size: 1.1rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .card-header .batch-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: .78rem;
      color: var(--gold-l);
    }
    .card-body { padding: 16px 20px; flex: 1; }
    .card-footer {
      padding: 12px 20px;
      background: var(--cream-d);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Stage pill */
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .stage-planning    { background: var(--blue-l);   color: var(--blue); }
    .stage-preparation { background: var(--orange-l); color: var(--orange); }
    .stage-fermentation{ background: var(--green-l);  color: var(--green); }
    .stage-aging       { background: #F0EAF8;         color: #5A2A8C; }
    .stage-complete    { background: var(--cream-d);  color: var(--muted); }

    /* Mini stage progress */
    .mini-pipeline {
      display: flex;
      gap: 3px;
      margin: 10px 0 4px;
    }
    .mini-stage {
      height: 5px;
      flex: 1;
      border-radius: 3px;
      background: var(--cream-d);
      transition: background .3s;
    }
    .mini-stage.done    { background: var(--green); }
    .mini-stage.current { background: var(--gold); }
    .mini-stage.pending { background: var(--cream-d); }

    /* Countdown chip */
    .countdown-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--orange-l);
      color: var(--orange);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: .78rem;
      font-weight: bold;
    }

    /* ── Modal ─────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,24,16,.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      background: linear-gradient(135deg, var(--burgundy-d), var(--burgundy));
      color: var(--cream);
      padding: 20px 24px 16px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 { font-size: 1.2rem; }
    .modal-close {
      background: transparent;
      color: var(--cream);
      font-size: 1.4rem;
      line-height: 1;
      padding: 0 4px;
      opacity: .7;
      cursor: pointer;
      border: none;
    }
    .modal-close:hover { opacity: 1; }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      background: var(--cream-d);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    /* ── Form Styles ───────────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: .85rem;
      font-weight: bold;
      color: var(--ink-l);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid var(--cream-d);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .95rem;
      color: var(--ink);
      background: var(--white);
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--burgundy);
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }

    /* ── Toast ─────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
    }
    .toast {
      background: var(--ink);
      color: var(--cream);
      padding: 12px 18px;
      border-radius: var(--radius);
      font-size: .9rem;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(8px);
      animation: toastIn .2s forwards, toastOut .3s 2.8s forwards;
      max-width: 320px;
    }
    .toast.success { background: var(--green); }
    .toast.error   { background: #c0392b; }
    @keyframes toastIn  { to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

    /* ── Batch Detail View ─────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--burgundy);
      font-family: inherit;
      font-size: .9rem;
      cursor: pointer;
      padding: 6px 0;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .back-btn:hover { color: var(--burgundy-d); text-decoration: underline; }

    .detail-hero {
      background: linear-gradient(135deg, var(--burgundy-d) 0%, var(--burgundy) 70%, var(--burgundy-l) 100%);
      color: var(--cream);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .detail-hero h2 { font-size: 1.6rem; margin-bottom: 6px; }
    .detail-hero .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: .82rem;
      color: var(--gold-l);
    }
    .detail-hero .meta span { display: flex; align-items: center; gap: 4px; }

    /* Stage Pipeline */
    .stage-pipeline {
      display: flex;
      align-items: center;
      margin-bottom: 28px;
      overflow-x: auto;
      padding-bottom: 6px;
      gap: 0;
    }
    .pipeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 70px;
      position: relative;
      cursor: default;
    }
    .pipeline-step::before {
      content: '';
      position: absolute;
      top: 17px;
      left: -50%;
      width: 100%;
      height: 3px;
      background: var(--cream-d);
      z-index: 0;
    }
    .pipeline-step:first-child::before { display: none; }
    .pipeline-step.done::before   { background: var(--green); }
    .pipeline-step.current::before { background: var(--gold); }

    .step-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .95rem;
      border: 3px solid var(--cream-d);
      background: var(--white);
      position: relative;
      z-index: 1;
      transition: all .2s;
    }
    .pipeline-step.done    .step-circle { background: var(--green);  border-color: var(--green);  color: #fff; font-size: .8rem; }
    .pipeline-step.current .step-circle { background: var(--gold);   border-color: var(--gold);   color: var(--ink); box-shadow: 0 0 0 4px rgba(200,150,62,.25); }
    .pipeline-step.pending .step-circle { background: var(--white);  border-color: var(--cream-d); color: var(--muted); }

    .step-label {
      font-size: .65rem;
      text-align: center;
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.2;
      max-width: 64px;
    }
    .pipeline-step.done    .step-label { color: var(--green); font-weight: bold; }
    .pipeline-step.current .step-label { color: var(--gold);  font-weight: bold; }

    /* Stage Content Card */
    .stage-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .stage-card-header {
      background: linear-gradient(90deg, var(--cream-d), var(--cream));
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--cream-d);
    }
    .stage-card-header h3 {
      font-size: 1.1rem;
      color: var(--burgundy);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stage-card-body { padding: 24px; }
    .stage-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 24px;
      background: var(--cream-d);
      border-top: 1px solid #DDD4C0;
    }
    .stage-actions .hint { font-size: .82rem; color: var(--muted); }

    /* Section divider inside stage */
    .section-title {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      border-bottom: 1px solid var(--cream-d);
      padding-bottom: 6px;
      margin: 20px 0 14px;
    }
    .section-title:first-child { margin-top: 0; }

    /* Info box */
    .info-box {
      background: var(--blue-l);
      border-left: 4px solid var(--blue);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 12px 16px;
      font-size: .85rem;
      color: var(--blue);
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .info-box.cherry { background: #FEF0F0; border-left-color: var(--burgundy); color: var(--burgundy); }

    /* Completed stage banner */
    .completed-banner {
      background: var(--green-l);
      border: 1px solid var(--green);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      color: var(--green);
      margin-bottom: 16px;
    }

    /* ── Footer ────────────────────────────────────────────────── */
    .app-footer {
      text-align: center;
      padding: 14px;
      font-size: .78rem;
      color: var(--muted);
      border-top: 1px solid var(--cream-d);
    }
  </style>
</head>
<body>

<!-- ═══ HEADER ══════════════════════════════════════════════════════ -->
<header class="app-header">
  <div class="logo">
    <span class="icon">🍷</span>
    <div>
      Vintner's Log
      <span class="sub">Wine Batch Manager</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openNewBatchModal()">+ New Batch</button>
  </div>
</header>

<!-- ═══ MAIN BODY ════════════════════════════════════════════════════ -->
<main class="app-body">

  <!-- BATCH DETAIL VIEW -->
  <div id="view-detail" class="view">

    <button class="back-btn" onclick="showDashboard()">&#8592; All Batches</button>

    <!-- Hero -->
    <div class="detail-hero" id="detail-hero"></div>

    <!-- Stage Pipeline -->
    <div class="stage-pipeline" id="detail-pipeline"></div>

    <!-- Stage Content -->
    <div id="detail-stage-content"></div>

  </div>

  <!-- DASHBOARD VIEW -->
  <div id="view-dashboard" class="view active">
    <div class="dashboard-header">
      <h1>
        My Batches
        <span>Track every stage from fruit to bottle</span>
      </h1>
      <button class="btn btn-primary" onclick="openNewBatchModal()">+ New Batch</button>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar"></div>

    <!-- Batch grid -->
    <div class="batch-grid" id="batch-grid"></div>
  </div>

</main>

<!-- ═══ FOOTER ═══════════════════════════════════════════════════════ -->
<footer class="app-footer">
  Vintner's Log &mdash; Sprint 1 &bull; Dashboard &amp; Batch Management
</footer>

<!-- ═══ NEW BATCH MODAL ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-new-batch">
  <div class="modal">
    <div class="modal-header">
      <h2>🍇 Start a New Batch</h2>
      <button class="modal-close" onclick="closeModal('modal-new-batch')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Batch Name</label>
        <input type="text" id="nb-name" placeholder="e.g. Backyard Sweet Cherry 2026" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fruit / Ingredient</label>
          <input type="text" id="nb-fruit" placeholder="e.g. Sweet Cherry" />
        </div>
        <div class="form-group">
          <label>Vintage Year</label>
          <input type="number" id="nb-year" placeholder="2026" min="2000" max="2100" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Batch Size (gallons)</label>
          <input type="number" id="nb-gallons" placeholder="3" step="0.5" min="0.5" />
        </div>
        <div class="form-group">
          <label>Fruit Source</label>
          <select id="nb-source">
            <option value="Home Garden">Home Garden</option>
            <option value="Local Farm">Local Farm</option>
            <option value="Farmers Market">Farmers Market</option>
            <option value="Wild Foraged">Wild Foraged</option>
            <option value="Commercial">Commercial</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Estimated Harvest / Start Date</label>
        <input type="date" id="nb-harvest-date" />
        <p class="form-hint">Leave blank if still planning. You can update later.</p>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="nb-notes" placeholder="Any initial notes about this batch..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-new-batch')">Cancel</button>
      <button class="btn btn-primary" onclick="createBatch()">Create Batch</button>
    </div>
  </div>
</div>

<!-- ═══ TOAST CONTAINER ═══════════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══ APP SCRIPT ════════════════════════════════════════════════════ -->
<script>
// ─── Constants ──────────────────────────────────────────────────────
const STORAGE_KEY = 'vintners_log_v1';

const STAGES = [
  { id: 'fruit_selection',        label: 'Fruit Selection',   icon: '🍒', group: 'planning' },
  { id: 'methodology',            label: 'Methodology',       icon: '📋', group: 'planning' },
  { id: 'recipe',                 label: 'Recipe',            icon: '🧪', group: 'planning' },
  { id: 'preparation',            label: 'Preparation',       icon: '⚗️',  group: 'preparation' },
  { id: 'primary_fermentation',   label: 'Primary Ferm.',     icon: '🫧', group: 'fermentation' },
  { id: 'secondary_fermentation', label: 'Secondary Ferm.',   icon: '🔬', group: 'fermentation' },
  { id: 'clarification',          label: 'Clarification',     icon: '✨', group: 'fermentation' },
  { id: 'bottling',               label: 'Bottling',          icon: '🍾', group: 'aging' },
  { id: 'aging',                  label: 'Aging',             icon: '🪵', group: 'aging' },
];

const STAGE_IDS = STAGES.map(s => s.id);

const GROUP_CLASS = {
  planning:     'stage-planning',
  preparation:  'stage-preparation',
  fermentation: 'stage-fermentation',
  aging:        'stage-aging',
  complete:     'stage-complete',
};

// ─── Data Layer ──────────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { batches: [] };
  } catch { return { batches: [] }; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getData() { return loadData(); }

function seedCherryBatch() {
  const data = loadData();
  const already = data.batches.find(b => b.id === 'cherry-2026-seed');
  if (already) return;

  const cherryBatch = {
    id: 'cherry-2026-seed',
    name: 'Backyard Sweet Cherry 2026',
    fruit: 'Sweet Cherry',
    year: 2026,
    gallons: 3,
    source: 'Home Garden',
    harvest_date: '2026-06-20',
    blossom_date: '2026-04-11',
    current_stage: 'fruit_selection',
    completed_stages: [],
    created: new Date().toISOString(),
    notes: 'Two sweet cherry trees in the backyard blossomed April 11, 2026. Estimated harvest late June. Planning a 3-gallon batch.',
    stages: {}
  };

  data.batches.unshift(cherryBatch);
  saveData(data);
}

// ─── Utilities ───────────────────────────────────────────────────────
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function daysUntil(isoDate) {
  if (!isoDate) return null;
  const target = new Date(isoDate + 'T00:00:00');
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.ceil((target - now) / 86400000);
}

function stageIndex(stageId) {
  return STAGE_IDS.indexOf(stageId);
}

function getStageInfo(stageId) {
  return STAGES.find(s => s.id === stageId) || STAGES[0];
}

function batchProgress(batch) {
  const idx = stageIndex(batch.current_stage);
  return { current: idx, total: STAGES.length };
}

function batchGroupClass(batch) {
  if (batch.completed_stages?.length === STAGES.length) return 'stage-complete';
  const info = getStageInfo(batch.current_stage);
  return GROUP_CLASS[info.group] || 'stage-planning';
}

// ─── Toast ───────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const tc = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ─── Modal ───────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function openNewBatchModal() {
  // Reset form
  ['nb-name','nb-fruit','nb-year','nb-gallons','nb-harvest-date','nb-notes']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('nb-year').value = new Date().getFullYear();
  openModal('modal-new-batch');
}

// ─── Create Batch ─────────────────────────────────────────────────────
function createBatch() {
  const name  = document.getElementById('nb-name').value.trim();
  const fruit = document.getElementById('nb-fruit').value.trim();
  const year  = document.getElementById('nb-year').value;

  if (!name) { showToast('Please enter a batch name.', 'error'); return; }
  if (!fruit) { showToast('Please enter the fruit / ingredient.', 'error'); return; }

  const batch = {
    id: generateId(),
    name,
    fruit,
    year: parseInt(year) || new Date().getFullYear(),
    gallons: parseFloat(document.getElementById('nb-gallons').value) || null,
    source: document.getElementById('nb-source').value,
    harvest_date: document.getElementById('nb-harvest-date').value || null,
    blossom_date: null,
    current_stage: 'fruit_selection',
    completed_stages: [],
    created: new Date().toISOString(),
    notes: document.getElementById('nb-notes').value.trim(),
    stages: {}
  };

  const data = loadData();
  data.batches.unshift(batch);
  saveData(data);

  closeModal('modal-new-batch');
  showToast(`"${batch.name}" batch created!`, 'success');
  renderDashboard();
}

// ─── Delete Batch ────────────────────────────────────────────────────
function deleteBatch(id, name, evt) {
  evt.stopPropagation();
  if (!confirm(`Delete batch "${name}"? This cannot be undone.`)) return;
  const data = loadData();
  data.batches = data.batches.filter(b => b.id !== id);
  saveData(data);
  showToast(`"${name}" deleted.`);
  renderDashboard();
}

// ─── Render Dashboard ────────────────────────────────────────────────
function renderDashboard() {
  const data = loadData();
  const batches = data.batches;

  // Stats
  const stats = {
    total:      batches.length,
    planning:   batches.filter(b => ['fruit_selection','methodology','recipe'].includes(b.current_stage)).length,
    active:     batches.filter(b => ['preparation','primary_fermentation','secondary_fermentation','clarification'].includes(b.current_stage)).length,
    finishing:  batches.filter(b => ['bottling','aging'].includes(b.current_stage)).length,
  };

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card">
      <div class="val">${stats.total}</div>
      <div class="lbl">Total Batches</div>
    </div>
    <div class="stat-card" style="border-left-color:var(--blue)">
      <div class="val" style="color:var(--blue)">${stats.planning}</div>
      <div class="lbl">Planning</div>
    </div>
    <div class="stat-card green">
      <div class="val">${stats.active}</div>
      <div class="lbl">Active</div>
    </div>
    <div class="stat-card gold">
      <div class="val">${stats.finishing}</div>
      <div class="lbl">Finishing</div>
    </div>
  `;

  // Batch cards
  const grid = document.getElementById('batch-grid');
  if (batches.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="icon">🍇</div>
        <p>No batches yet. Start your first batch!</p>
      </div>`;
    return;
  }

  grid.innerHTML = batches.map(b => renderBatchCard(b)).join('');
}

function renderBatchCard(batch) {
  const { current, total } = batchProgress(batch);
  const stageInfo = getStageInfo(batch.current_stage);
  const groupClass = batchGroupClass(batch);

  // Mini pipeline dots
  const pipeline = STAGES.map((s, i) => {
    let cls = 'pending';
    if (i < current) cls = 'done';
    else if (i === current) cls = 'current';
    return `<div class="mini-stage ${cls}" title="${s.label}"></div>`;
  }).join('');

  // Countdown for batches with harvest date
  let countdownHtml = '';
  if (batch.harvest_date && ['fruit_selection','methodology','recipe'].includes(batch.current_stage)) {
    const days = daysUntil(batch.harvest_date);
    if (days !== null) {
      const label = days > 0 ? `Harvest in ${days} day${days !== 1 ? 's' : ''}`
                 : days === 0 ? 'Harvest today!'
                 : `Harvest was ${Math.abs(days)} days ago`;
      countdownHtml = `<div class="countdown-chip">🗓 ${label}</div>`;
    }
  }

  // Blossom note
  let blossomHtml = '';
  if (batch.blossom_date) {
    blossomHtml = `<span>🌸 Blossomed ${formatDate(batch.blossom_date)}</span>`;
  }

  return `
    <div class="batch-card" onclick="openBatch('${batch.id}')">
      <div class="card-header">
        <div class="batch-name">${batch.name}</div>
        <div class="batch-meta">
          <span>${batch.fruit}</span>
          <span>•</span>
          <span>${batch.year}</span>
          ${batch.gallons ? `<span>•</span><span>${batch.gallons} gal</span>` : ''}
          <span>•</span>
          <span>${batch.source}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="mini-pipeline">${pipeline}</div>
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:10px">
          Stage ${current + 1} of ${total} — ${stageInfo.icon} ${stageInfo.label}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span class="stage-pill ${groupClass}">${stageInfo.icon} ${stageInfo.label}</span>
          ${countdownHtml}
        </div>
        ${blossomHtml ? `<div style="font-size:.78rem;color:var(--muted);margin-top:8px">${blossomHtml}</div>` : ''}
        ${batch.notes ? `<p style="font-size:.82rem;color:var(--ink-l);margin-top:10px;line-height:1.5;border-top:1px solid var(--cream-d);padding-top:8px">${batch.notes.length > 120 ? batch.notes.slice(0,120) + '…' : batch.notes}</p>` : ''}
      </div>
      <div class="card-footer">
        <span style="font-size:.75rem;color:var(--muted)">Created ${formatDate(batch.created)}</span>
        <button class="btn btn-danger btn-sm" onclick="deleteBatch('${batch.id}', '${batch.name.replace(/'/g,"\\'")}', event)">Delete</button>
      </div>
    </div>`;
}

// ─── Render Detail ────────────────────────────────────────────────────
function renderDetail(batch) {
  renderDetailHero(batch);
  renderPipeline(batch);
  renderStageContent(batch);
}

function renderDetailHero(batch) {
  const stageInfo = getStageInfo(batch.current_stage);
  const groupClass = batchGroupClass(batch);
  let countdown = '';
  if (batch.harvest_date) {
    const days = daysUntil(batch.harvest_date);
    if (days !== null && days > 0) countdown = `<span>🗓 Harvest in ${days} days (${formatDate(batch.harvest_date)})</span>`;
    else if (days === 0) countdown = `<span>🗓 Harvest day!</span>`;
  }
  document.getElementById('detail-hero').innerHTML = `
    <div>
      <h2>${batch.name}</h2>
      <div class="meta">
        <span>🍒 ${batch.fruit}</span>
        <span>📅 ${batch.year}</span>
        ${batch.gallons ? `<span>🫙 ${batch.gallons} gallons</span>` : ''}
        <span>🏡 ${batch.source}</span>
        ${countdown}
      </div>
    </div>
    <div style="text-align:right">
      <span class="stage-pill ${groupClass}" style="font-size:.85rem;padding:5px 14px">
        ${stageInfo.icon} ${stageInfo.label}
      </span>
    </div>`;
}

function renderPipeline(batch) {
  const currentIdx = stageIndex(batch.current_stage);
  const html = STAGES.map((s, i) => {
    let cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : 'pending';
    const icon = cls === 'done' ? '✓' : s.icon;
    return `
      <div class="pipeline-step ${cls}" title="${s.label}">
        <div class="step-circle">${icon}</div>
        <div class="step-label">${s.label}</div>
      </div>`;
  }).join('');
  document.getElementById('detail-pipeline').innerHTML = html;
}

function renderStageContent(batch) {
  const stage = batch.current_stage;
  const el = document.getElementById('detail-stage-content');
  switch (stage) {
    case 'fruit_selection': el.innerHTML = renderFruitSelectionStage(batch); break;
    case 'methodology':     el.innerHTML = renderMethodologyStage(batch);    break;
    default:
      el.innerHTML = `<div class="stage-card">
        <div class="stage-card-header"><h3>${getStageInfo(stage).icon} ${getStageInfo(stage).label}</h3></div>
        <div class="stage-card-body" style="color:var(--muted);padding:32px;text-align:center">
          This stage form is coming in a future sprint. Check back soon!
        </div>
      </div>`;
  }
  // Render completed stages below current
  const currentIdx = stageIndex(batch.current_stage);
  let completedHtml = '';
  STAGES.forEach((s, i) => {
    if (i >= currentIdx) return;
    const data = batch.stages[s.id] || {};
    completedHtml += renderCompletedStageSummary(s, data, batch);
  });
  el.innerHTML += completedHtml;
}

function saveFruitSelection(advance) {
  const data = loadData();
  const batch = data.batches.find(b => b.id === currentBatchId);
  if (!batch) return;
  if (!batch.stages) batch.stages = {};
  batch.stages.fruit_selection = {
    variety:      document.getElementById('fs-variety').value.trim(),
    source:       document.getElementById('fs-source').value,
    est_quantity: document.getElementById('fs-est-qty').value,
    act_quantity: document.getElementById('fs-act-qty').value,
    blossom_date: document.getElementById('fs-blossom').value,
    est_harvest:  document.getElementById('fs-est-harvest').value,
    act_harvest:  document.getElementById('fs-act-harvest').value,
    brix:         document.getElementById('fs-brix').value,
    ph:           document.getElementById('fs-ph').value,
    quality:      document.getElementById('fs-quality').value.trim(),
    notes:        document.getElementById('fs-notes').value.trim(),
    saved_at:     new Date().toISOString(),
  };
  // Sync top-level fields
  const fs = batch.stages.fruit_selection;
  if (fs.variety)      batch.fruit         = fs.variety;
  if (fs.blossom_date) batch.blossom_date  = fs.blossom_date;
  if (fs.est_harvest)  batch.harvest_date  = fs.est_harvest;
  if (fs.act_harvest)  batch.harvest_date  = fs.act_harvest;

  if (advance) {
    if (!batch.completed_stages.includes('fruit_selection'))
      batch.completed_stages.push('fruit_selection');
    batch.current_stage = 'methodology';
  }
  saveData(data);
  showToast(advance ? 'Stage complete! Moving to Methodology.' : 'Fruit Selection saved.', 'success');
  renderDetail(batch);
}

          <label>Aging &amp; Finishing Plan</label>
          <select id="meth-aging">
            ${['Drink young (within 6 months)','6–12 months in bottle','1–2 years in bottle','Oak aging (6 months)','Oak aging (1 year+)','Other']
              .map(o => `<option${o === vals.aging_plan ? ' selected' : ''}>${o}</option>`).join('')}
          </select>
        </div>

        <div class="section-title">Notes</div>
        <div class="form-group">
          <textarea id="meth-notes" placeholder="Any specific decisions, inspirations, or goals for this batch...">${escHtml(vals.notes)}</textarea>
        </div>
      </div>
      <div class="stage-actions">
        <span class="hint">Save your methodology. Mark complete to advance to Recipe.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline" onclick="saveMethodology()">Save</button>
          ${!isCompleted
            ? `<button class="btn btn-primary" onclick="completeMethodology()">Mark Complete &amp; Next Stage &#8594;</button>`
            : `<button class="btn btn-gold" onclick="saveMethodology()">Update</button>`}
        </div>
      </div>
    </div>`;
}

function saveMethodology(advance) {
  const data = loadData();
  const batch = data.batches.find(b => b.id === currentBatchId);
  if (!batch) return;
  if (!batch.stages) batch.stages = {};
  batch.stages.methodology = {
    style:      document.getElementById('meth-style').value,
    sweetness:  document.getElementById('meth-sweetness').value,
    target_abv: document.getElementById('meth-abv').value,
    approach:   document.getElementById('meth-approach').value,
    yeast:      document.getElementById('meth-yeast').value,
    so2:        document.getElementById('meth-so2').value,
    aging_plan: document.getElementById('meth-aging').value,
    notes:      document.getElementById('meth-notes').value.trim(),
    saved_at:   new Date().toISOString(),
  };
  if (advance) {
    if (!batch.completed_stages.includes('methodology'))
      batch.completed_stages.push('methodology');
    batch.current_stage = 'recipe';
  }
  saveData(data);
  showToast(advance ? 'Methodology complete! Moving to Recipe.' : 'Methodology saved.', 'success');
  renderDetail(batch);
}

function completeMethodology() { saveMethodology(true); }

// ─── Completed Stage Summary ──────────────────────────────────────────
function renderCompletedStageSummary(stageObj, data, batch) {
  const pairs = [];
  if (stageObj.id === 'fruit_selection') {
    if (data.variety)      pairs.push(['Variety', data.variety]);
    if (data.est_quantity) pairs.push(['Est. Qty', data.est_quantity + ' lbs']);
    if (data.act_quantity) pairs.push(['Actual Qty', data.act_quantity + ' lbs']);
    if (data.act_harvest)  pairs.push(['Harvested', formatDate(data.act_harvest)]);
    if (data.brix)         pairs.push(['Brix', data.brix]);
    if (data.ph)           pairs.push(['pH', data.ph]);
  }
  if (stageObj.id === 'methodology') {
    if (data.style)      pairs.push(['Style', data.style]);
    if (data.sweetness)  pairs.push(['Target', data.sweetness]);
    if (data.target_abv) pairs.push(['Target ABV', data.target_abv + '%']);
    if (data.yeast)      pairs.push(['Yeast', data.yeast]);
  }
  const rows = pairs.map(([k,v]) => `
    <span style="font-size:.82rem;color:var(--muted)">${k}:</span>
    <span style="font-size:.82rem;font-weight:bold;color:var(--ink)">${escHtml(String(v))}</span>`).join('');

  return `
    <div class="stage-card" style="border-left:4px solid var(--green);opacity:.85">
      <div class="stage-card-header" style="padding:12px 20px">
        <h3 style="font-size:.95rem">${stageObj.icon} ${stageObj.label} <span style="color:var(--green);font-size:.75rem;margin-left:6px">✓ Complete</span></h3>
        <button class="btn btn-outline btn-sm" onclick="revisitStage('${stageObj.id}')">Edit</button>
      </div>
      ${pairs.length ? `<div class="stage-card-body" style="padding:14px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 16px">${rows}</div>` : ''}
    </div>`;
}

function revisitStage(stageId) {
  const data = loadData();
  const batch = data.batches.find(b => b.id === currentBatchId);
  if (!batch) return;
  // Allow editing completed stages without regression
  batch.current_stage = stageId;
  saveData(data);
  renderDetail(batch);
  showToast(`Editing: ${getStageInfo(stageId).label}`);
}

// ─── HTML Escape ──────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ────────────────────────────────────────────────────────────
function init() {
  seedCherryBatch();
  renderDashboard();
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.remove('open');
  });
});

init();
</script>
</body>
</html>
